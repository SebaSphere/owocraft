plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
println "DEBUG: Minecraft: ${minecraft_version}, ParchmentMC: ${parchment_minecraft}, ParchmentVer: ${parchment_version}"

repositories {
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
    }
    maven {
        name = "Sonatype Snapshots"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    maven {
        name = "Minecraft"
        url = "https://libraries.minecraft.net/"
    }
    maven {
        url "https://maven2.bai.lol"
        content {
            includeGroup "lol.bai"
        }
    }
    maven {
        url "https://repo1.maven.org/maven2"
        name "jython"
    }
    maven {
        url = "https://maven.isxander.dev/releases"
        name = "Xander Maven"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = 'Fabric'
        url = uri('https://maven.fabricmc.net')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation("org.python:jython-standalone:${jython_version}")
    include("org.python:jython-standalone:${jython_version}")

//    include "com.github.jnr:jnr-constants:0.9.12"
//    include "com.github.jnr:jnr-posix:3.0.50"
//    include "com.github.jnr:jnr-ffi:2.1.10"
//    include "com.github.jnr:jffi:1.2.20"
//    include "com.github.jnr:jnr-netdb:1.1.6"
//    include "com.github.jnr:jnr-a64asm:1.0.0"
//    include "com.github.jnr:jnr-x86asm:1.0.2"
//    include "org.antlr:antlr:3.5.2"
//    include "org.antlr:antlr-runtime:3.5.2"
//    include "org.antlr:ST4:4.0.8"
//    include "com.carrotsearch:java-sizeof:0.0.5"
//    include "jline:jline:2.14.5"
//    include "javax.servlet:javax.servlet-api:3.1.0"
//    include "org.bouncycastle:bcpkix-jdk15on:1.62"
//    include "org.bouncycastle:bcprov-jdk15on:1.62"


    modImplementation "maven.modrinth:yacl:${project.yacl_version}-fabric"

    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}