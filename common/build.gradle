plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

repositories {
    maven {
        url "https://maven2.bai.lol"
        content {
            includeGroup "lol.bai"
        }
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://repo1.maven.org/maven2"
        name "jython"
    }
    maven {
        url = "https://maven.isxander.dev/releases"
        name = "Xander Maven"
    }
    maven {
        name = 'Fabric'
        url = uri('https://maven.fabricmc.net')
    }
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.3.5"
    compileOnly "org.python:jython-standalone:${jython_version}"
    compileOnly "org.ow2.asm:asm:9.7"
    compileOnly "org.ow2.asm:asm-commons:9.7"

    compileOnly "org.jetbrains:annotations:24.1.0"

    compileOnly "maven.modrinth:yacl:${project.yacl_version}-forge"

}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

tasks.named('compileJava', JavaCompile) {
}

tasks.named('sourcesJar') {
    dependsOn 'zipJythonLibs'
}

task zipJythonLibs(type: Zip) {
    from 'jython/Core'
    archiveFileName = 'Core.zip'
    destinationDirectory = file('src/main/resources/assets/owocraft/jython_libs')
}

processResources {
    dependsOn zipJythonLibs
}

clean {
    delete 'src/main/resources/assets/owocraft/jython_libs/Core.zip'
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}